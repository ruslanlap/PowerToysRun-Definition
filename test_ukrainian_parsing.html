<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Ukrainian Parsing</title>
</head>
<body>
    <h1>Testing sum.in.ua parsing</h1>
    <script>
        fetch('https://sum.in.ua/s/слово')
            .then(response => response.text())
            .then(html => {
                console.log('=== Full HTML ===');
                console.log(html);
                
                // Parse with DOMParser
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                console.log('=== Looking for div#article ===');
                const article = doc.querySelector('div#article');
                console.log(article ? article.outerHTML : 'NOT FOUND');
                
                console.log('=== Looking for div[itemprop=articleBody] ===');
                const articleBody = doc.querySelector('div[itemprop="articleBody"]');
                console.log(articleBody ? articleBody.outerHTML : 'NOT FOUND');
                
                console.log('=== All divs with id ===');
                const divsWithId = doc.querySelectorAll('div[id]');
                divsWithId.forEach(div => console.log(`- ${div.id}`));
                
                console.log('=== All divs with itemprop ===');
                const divsWithItemprop = doc.querySelectorAll('div[itemprop]');
                divsWithItemprop.forEach(div => console.log(`- ${div.getAttribute('itemprop')}`));
            })
            .catch(err => console.error('Error:', err));
    </script>
</body>
</html>
