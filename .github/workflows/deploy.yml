name: Publish CmdPal Extension to Microsoft Store

permissions:
  contents: write

on:
  release:
    types: [released]

  workflow_dispatch:
    inputs:
      skip_store_publish:
        description: 'Skip Microsoft Store publish (build only)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0.0"
          fi
          # Ensure 4-part version (x.y.z.w)
          IFS='.' read -ra PARTS <<< "$VERSION"
          while [ ${#PARTS[@]} -lt 4 ]; do
            PARTS+=("0")
          done
          FULL_VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}.${PARTS[3]}"
          echo "VERSION=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Update Package.appxmanifest version
        shell: pwsh
        run: |
          $manifestPath = "CmdPal/DefinitionExtension/Package.appxmanifest"
          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = "${{ steps.get_version.outputs.VERSION }}"
          $manifest.Save($manifestPath)
          Write-Host "Updated manifest version to ${{ steps.get_version.outputs.VERSION }}"

      - name: Restore NuGet packages
        run: dotnet restore CmdPal/CmdPal-Definition.sln -p:Platform=${{ matrix.platform }}

      - name: Build MSIX package
        run: |
          msbuild CmdPal/DefinitionExtension/DefinitionExtension.csproj `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeIdentifier=win-${{ matrix.platform }} `
            /p:AppxPackageDir="${{ github.workspace }}/AppPackages/" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:PublishSingleFile=false `
            /p:PublishTrimmed=false `
            /p:GenerateAppxPackageOnBuild=true
        shell: pwsh

      - name: Find MSIX package
        id: find_msix
        shell: pwsh
        run: |
          $msixFiles = Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse -Filter "*.msix"
          if ($msixFiles.Count -eq 0) {
            Write-Error "No MSIX files found in AppPackages directory"
            Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $msixPath = $msixFiles[0].FullName
          Write-Host "Found MSIX: $msixPath"
          echo "MSIX_PATH=$msixPath" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ steps.find_msix.outputs.MSIX_PATH }}

  bundle:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download x64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-x64
          path: msix-x64

      - name: Download ARM64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-arm64
          path: msix-arm64

      - name: Install Windows SDK (makeappx)
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1
          if ($makeappx) {
            Write-Host "Found makeappx at: $($makeappx.FullName)"
            echo "MAKEAPPX=$($makeappx.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "makeappx.exe not found"
            exit 1
          }

      - name: Create MSIX Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle-input
          New-Item -ItemType Directory -Force -Path bundle-output

          # Copy all MSIX files into bundle input
          Get-ChildItem -Path msix-x64 -Filter "*.msix" | Copy-Item -Destination bundle-input/
          Get-ChildItem -Path msix-arm64 -Filter "*.msix" | Copy-Item -Destination bundle-input/

          Write-Host "Bundle input contents:"
          Get-ChildItem bundle-input

          & $env:MAKEAPPX bundle /d bundle-input /p bundle-output/DefinitionForCommandPalette.msixbundle /o
          Write-Host "Bundle created successfully"

      - name: Upload MSIX Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: msixbundle
          path: bundle-output/DefinitionForCommandPalette.msixbundle

  publish:
    needs: bundle
    runs-on: windows-latest
    if: >-
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_store_publish != 'true'))

    steps:
      - name: Download MSIX Bundle
        uses: actions/download-artifact@v4
        with:
          name: msixbundle
          path: bundle

      - name: Configure Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Authenticate with Microsoft Store
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.AZURE_AD_TENANT_ID }} `
            --sellerId ${{ secrets.SELLER_ID }} `
            --clientId ${{ secrets.AZURE_AD_CLIENT_ID }} `
            --clientSecret ${{ secrets.AZURE_AD_CLIENT_SECRET }}
        shell: pwsh

      - name: Publish to Microsoft Store
        run: |
          msstore publish "bundle/DefinitionForCommandPalette.msixbundle" --id 9NTTBMD2DHN0
        shell: pwsh

  upload-to-release:
    needs: bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download MSIX Bundle
        uses: actions/download-artifact@v4
        with:
          name: msixbundle
          path: bundle

      - name: Generate SHA256 checksum
        run: |
          cd bundle
          sha256sum DefinitionForCommandPalette.msixbundle > DefinitionForCommandPalette.msixbundle.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle/DefinitionForCommandPalette.msixbundle
            bundle/DefinitionForCommandPalette.msixbundle.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
