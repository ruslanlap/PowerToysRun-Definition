name: Publish to WinGet

on:
  workflow_run:
    workflows: ["Publish CmdPal Extension to Microsoft Store"]
    types: [completed]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')

    steps:
      - name: Get version from release
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            # workflow_run: extract tag from the head branch (e.g. v1.2.3)
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Verify release asset exists
        shell: bash
        run: |
          URL="https://github.com/ruslanlap/PowerToysRun-Definition/releases/download/${{ steps.get_version.outputs.TAG }}/DefinitionForCommandPalette.msixbundle"
          echo "Checking: $URL"
          curl --fail --silent --head -L "$URL" || { echo "::error::Release asset not found: $URL"; exit 1; }

      - name: Install wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe

      - name: Update and submit WinGet manifest
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $tag = "${{ steps.get_version.outputs.TAG }}"
          $url = "https://github.com/ruslanlap/PowerToysRun-Definition/releases/download/${tag}/DefinitionForCommandPalette.msixbundle"

          .\wingetcreate.exe update `
            --id "ruslanlap.DefinitionForCommandPalette" `
            --version $version `
            --urls $url `
            --token "${{ secrets.WINGET_GITHUB_TOKEN }}" `
            --submit
