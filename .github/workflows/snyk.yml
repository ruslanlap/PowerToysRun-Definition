name: Snyk Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore Definition/Definition.sln -p:EnableWindowsTargeting=true
      - uses: snyk/actions/setup@v1
      - name: Snyk scan
        run: snyk test --file=Definition/Community.PowerToys.Run.Plugin.Definition/Community.PowerToys.Run.Plugin.Definition.csproj
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
