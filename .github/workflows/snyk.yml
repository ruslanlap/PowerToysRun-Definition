name: Snyk Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore Definition/Definition.sln -p:EnableWindowsTargeting=true
      - name: Install Snyk CLI
        run: npm install -g snyk@1.1297.0
      - name: Snyk scan
        working-directory: Definition/Community.PowerToys.Run.Plugin.Definition
        run: snyk test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
