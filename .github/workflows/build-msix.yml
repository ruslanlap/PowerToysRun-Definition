name: Build CmdPal MSIX Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore CmdPal/CmdPal-Definition.sln -p:Platform=${{ matrix.platform }}

      - name: Build MSIX package
        run: |
          msbuild CmdPal/CmdPal-Definition.sln `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:AppxPackageDir="${{ github.workspace }}/AppPackages/" `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=true
        shell: pwsh

      - name: Find MSIX package
        id: find_msix
        shell: pwsh
        run: |
          $msixFiles = Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse -Filter "*.msix"
          if ($msixFiles.Count -eq 0) {
            Write-Host "No .msix found. Listing all files in AppPackages:"
            Get-ChildItem -Path "${{ github.workspace }}/AppPackages" -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $msixPath = $msixFiles[0].FullName
          Write-Host "Found MSIX: $msixPath"
          echo "MSIX_PATH=$msixPath" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.platform }}
          path: ${{ steps.find_msix.outputs.MSIX_PATH }}

  bundle:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download x64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-x64
          path: msix-x64

      - name: Download ARM64 MSIX
        uses: actions/download-artifact@v4
        with:
          name: msix-ARM64
          path: msix-ARM64

      - name: Find makeappx
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1
          if ($makeappx) {
            Write-Host "Found makeappx at: $($makeappx.FullName)"
            echo "MAKEAPPX=$($makeappx.FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Error "makeappx.exe not found"
            exit 1
          }

      - name: Create MSIX Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle-input
          New-Item -ItemType Directory -Force -Path bundle-output

          Get-ChildItem -Path msix-x64 -Filter "*.msix" | Copy-Item -Destination bundle-input/
          Get-ChildItem -Path msix-ARM64 -Filter "*.msix" | Copy-Item -Destination bundle-input/

          Write-Host "Bundle input contents:"
          Get-ChildItem bundle-input

          & $env:MAKEAPPX bundle /d bundle-input /p bundle-output/DefinitionForCommandPalette.msixbundle /o
          Write-Host "Bundle created successfully"

      - name: Upload MSIX Bundle
        uses: actions/upload-artifact@v4
        with:
          name: DefinitionForCommandPalette-msixbundle
          path: bundle-output/DefinitionForCommandPalette.msixbundle

      - name: Upload individual MSIX files
        uses: actions/upload-artifact@v4
        with:
          name: DefinitionForCommandPalette-individual-msix
          path: |
            msix-x64/*.msix
            msix-ARM64/*.msix
